<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    @keyframes move {
      from {
        transform: translate(0, 0);
      }
      to {
        transform: translateX(100px);
      }
    }
    :root {
      --backgorund-color:red
    }
    .outer {
      width: 20px;
      height: 20px;
      background-color: var(--backgorund-color);
      border-radius: 50%;
      animation: move linear 2s  forwards;
    }
  </style>
  <body>
    <div class="outer"></div>
  </body>
</html>
