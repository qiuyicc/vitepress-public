<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .outer {
      width: 200px;
      height: 200px;
      background-color: blue;
      position: relative;
    }

    .inner {
        position: absolute;
        width: 50px;
        height: 50px;
        margin: auto; 
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: red;
    }
  </style>
  <body>
    <div class="outer">
        <div class="inner"></div>
    </div>
  </body>
</html>
