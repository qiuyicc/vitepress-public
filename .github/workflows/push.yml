# Push 后构建 VitePress，并把静态产物同步到 VPS
# Secrets: SSH_HOST / SSH_USERNAME / SSH_PASSWORD，可选 SSH_PORT

name: Deploy VitePress

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vitepress
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # imagemin/pngquant 原生依赖在 CI 上常失败，构建站点不强制需要其 postinstall
      - name: Install and build
        run: |
          npm ci --ignore-scripts
          npm run docs:build

      - name: Upload dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: ".vitepress/dist/*"
          target: "/var/www/vitepress"
          strip_components: 2
          overwrite: true
          rm: false
